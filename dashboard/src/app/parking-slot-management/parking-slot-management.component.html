<div class="dashboard-layout">
    <app-sidebar class="dashboard-sidebar"></app-sidebar>
    <main class="dashboard-main">
        <div class="parking-management-container">
            
            <!-- Top filter bar -->
            <div class="top-bar">
                <div class="floor-selector">
                    <span class="label">Floor</span>
                    <div class="pill-group">
                        <button *ngFor="let level of levels" 
                                class="pill-btn" 
                                [class.active]="selectedLevel === level"
                                (click)="selectLevel(level)">
                           {{ level }}
                        </button>
                    </div>
                </div>

                <div class="vehicle-filter">
                    <div class="pill-group">
                        <button *ngFor="let filter of filters" 
                                class="pill-btn" 
                                [class.active]="selectedFilter === filter"
                                (click)="selectFilter(filter)">
                           <ng-container [ngSwitch]="filter">
                             <svg *ngSwitchCase="'Cars'" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a2 2 0 0 0-1.6-.8H8.3a2 2 0 0 0-1.6.8L4 11l-5.16.86a1 1 0 0 0-.84.99V16h3m10 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm-10 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/></svg>
                             <svg *ngSwitchCase="'Bikes'" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/></svg>
                             <svg *ngSwitchCase="'3-Wheel'" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="16" width="16" height="6" rx="2"/><path d="M12 16v-6"/><path d="M8 10h8l-4-6-4 6z"/></svg>
                           </ng-container>
                           {{ filter }}
                        </button>
                    </div>
                </div>

                <div class="status-summary">
                    <div class="stat"><span class="number">{{ filledCount }}</span> Filled</div>
                    <div class="stat"><span class="number">{{ emptyCount }}</span> Empty</div>
                    
                    <button class="icon-action-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </button>
                    <button class="icon-action-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>

                    <button class="btn-report">Report Problem</button>
                </div>
            </div>

            <!-- Map Layout -->
            <div class="map-container">
                <div class="map-grid">
                    <!-- Top Row: A <- B <- C -->
                    <div class="map-row">
                        <!-- Zone A -->
                        <div class="zone-wrapper">
                            <div class="zone-title">Zone A</div>
                            <div class="zone-box">
                                <div class="col left">
                                    <div class="slot" *ngFor="let s of zones[0].left" [ngClass]="s.state" [style.opacity]="isSlotVisible(s) ? 1 : 0.2">
                                        <span class="slot-id">{{ s.id }}</span>
                                        <div class="slot-visual"></div>
                                    </div>
                                </div>
                                <div class="col right">
                                    <div class="slot" *ngFor="let s of zones[0].right" [ngClass]="s.state" [style.opacity]="isSlotVisible(s) ? 1 : 0.2">
                                        <div class="slot-visual"></div>
                                        <span class="slot-id">{{ s.id }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="arrow-wrapper">
                            <svg class="arrow left" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        </div>

                        <!-- Zone B -->
                        <div class="zone-wrapper">
                            <div class="zone-title">Zone B</div>
                            <div class="zone-box">
                                <div class="col left">
                                    <div class="slot" *ngFor="let s of zones[1].left" [ngClass]="s.state" [style.opacity]="isSlotVisible(s) ? 1 : 0.2">
                                        <span class="slot-id">{{ s.id }}</span>
                                        <div class="slot-visual"></div>
                                    </div>
                                </div>
                                <div class="col right">
                                    <div class="slot" *ngFor="let s of zones[1].right" [ngClass]="s.state" [style.opacity]="isSlotVisible(s) ? 1 : 0.2">
                                        <div class="slot-visual"></div>
                                        <span class="slot-id">{{ s.id }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="arrow-wrapper">
                            <svg class="arrow left" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        </div>

                        <!-- Zone C -->
                        <div class="zone-wrapper relative">
                            <div class="entry-marker">Entry</div>
                            <div class="zone-title">Zone C</div>
                            <div class="zone-box">
                                <div class="col left">
                                    <div class="slot" *ngFor="let s of zones[2].left" [ngClass]="s.state" [style.opacity]="isSlotVisible(s) ? 1 : 0.2">
                                        <span class="slot-id">{{ s.id }}</span>
                                        <div class="slot-visual"></div>
                                    </div>
                                </div>
                                <div class="col right">
                                    <div class="slot" *ngFor="let s of zones[2].right" [ngClass]="s.state" [style.opacity]="isSlotVisible(s) ? 1 : 0.2">
                                        <div class="slot-visual"></div>
                                        <span class="slot-id">{{ s.id }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Middle vertical arrows -->
                    <div class="map-row transparent-row">
                        <div class="arrow-wrapper vertical-pad">
                            <svg class="arrow down" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                        </div>
                        <div class="spacer-large"></div>
                        <div class="arrow-wrapper vertical-pad">
                            <svg class="arrow down" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                        </div>
                    </div>

                    <!-- Bottom Row: D -> ... -> E -->
                    <div class="map-row">
                        <!-- Zone D -->
                        <div class="zone-wrapper">
                            <div class="zone-title">Zone D</div>
                            <div class="zone-box">
                                <div class="col left">
                                    <div class="slot" *ngFor="let s of zones[3].left" [ngClass]="s.state" [style.opacity]="isSlotVisible(s) ? 1 : 0.2">
                                        <span class="slot-id">{{ s.id }}</span>
                                        <div class="slot-visual"></div>
                                    </div>
                                </div>
                                <div class="col right">
                                    <div class="slot" *ngFor="let s of zones[3].right" [ngClass]="s.state" [style.opacity]="isSlotVisible(s) ? 1 : 0.2">
                                        <div class="slot-visual"></div>
                                        <span class="slot-id">{{ s.id }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="arrow-wrapper">
                            <svg class="arrow right" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </div>
                        
                        <div class="spacer-middle"></div>
                        
                        <div class="arrow-wrapper">
                            <svg class="arrow right" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </div>

                        <!-- Zone E -->
                        <div class="zone-wrapper relative">
                            <div class="zone-title">Zone E</div>
                            <div class="zone-box">
                                <div class="col left">
                                    <div class="slot" *ngFor="let s of zones[4].left" [ngClass]="s.state" [style.opacity]="isSlotVisible(s) ? 1 : 0.2">
                                        <span class="slot-id">{{ s.id }}</span>
                                        <div class="slot-visual"></div>
                                    </div>
                                </div>
                                <div class="col right">
                                    <div class="slot" *ngFor="let s of zones[4].right" [ngClass]="s.state" [style.opacity]="isSlotVisible(s) ? 1 : 0.2">
                                        <div class="slot-visual"></div>
                                        <span class="slot-id">{{ s.id }}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="exit-marker">Exit</div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>
</div>
